name: delivery_app
description: Production-ready delivery app with Flutter and Firebase.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.1
  firebase_core: ^3.5.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.1
  firebase_messaging: ^15.1.1
  cloud_functions: ^5.1.2
  flutter_map: ^7.0.0
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  flutter_dotenv: ^5.1.0
  image_picker: ^1.1.2
  dio: ^5.6.0
  uuid: ^4.4.0
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  json_annotation: ^4.9.0
  collection: ^1.18.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/mock/
